apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.10"
}

android {
    buildTypes {
        debug {
            testCoverageEnabled true
        }
    }
}

// Task para tests instrumentados
tasks.register('jacocoTestReport', JacocoReport) {
    group = "Reporting"
    description = "Genera informes de cobertura JaCoCo para tests instrumentados."

    // Cambiar dependencia a tests instrumentados
    dependsOn 'connectedDebugAndroidTest'

    reports {
        xml.required = true
        html.required = true
    }

    // Archivos a excluir
    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', '**/databinding/**/*.*', '**/*_Factory*.*', '**/*_HiltModules*.*',
            '**/*_MembersInjector*.*', '**/*_GeneratedInjector*.*', '**/*Dagger*.*', '**/*Hilt*.*',
            '**/*ComposableSingletons*.*', '**/*$lambda-*$*.*', '**/META-INF/*.*'
    ]

    // Usar directorios en lugar de intentar procesar archivos individuales
    def debugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def javaDebugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def altJavaDebugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)

    // Asegúrate de que classDirectories use un conjunto de archivos válido
    def classFiles = files([debugTree, kotlinDebugTree, javaDebugTree, altJavaDebugTree])
    classDirectories.setFrom(classFiles)

    sourceDirectories.setFrom(files([
            "${project.projectDir}/src/main/java",
            "${project.projectDir}/src/main/kotlin"
    ]))

    // Modificar para usar archivos de cobertura de tests instrumentados
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            "outputs/code_coverage/debugAndroidTest/connected/**/*.ec",
            "outputs/code_coverage/**/coverage.ec"
    ]))

    doLast {
        println "Módulo: ${project.name}"
        println "Archivos de ejecución encontrados: ${executionData.files.size()}"
        executionData.files.each { file ->
            println "- $file (${file.exists() ? 'EXISTE' : 'NO EXISTE'}) - Tamaño: ${file.exists() ? file.length() : 0} bytes"
        }

        // Verificación de directorios de clases
        println "Directorios de clases configurados: ${classDirectories.files.size()}"
        classDirectories.files.each { item ->
            if (item.exists()) {
                if (item.isDirectory()) {
                    def classCount = 0
                    item.eachFileRecurse { file ->
                        if (file.isFile() && file.name.endsWith('.class')) classCount++
                    }
                    println "- $item (EXISTE) - Contiene: $classCount clases"
                } else {
                    println "- $item (EXISTE pero es un ARCHIVO, no un directorio)"
                }
            } else {
                println "- $item (NO EXISTE)"
            }
        }

        // Verificar si el archivo .exec contiene datos útiles
        executionData.files.each { file ->
            if (file.exists() && file.length() > 0) {
                println "Analizando archivo de ejecución: ${file.name}"
                println "Este archivo debería contener datos de cobertura. Verifica que las pruebas realmente ejecuten el código de la aplicación."
            }
        }

        println "Informe generado en: ${reports.html.outputLocation.get()}"

    }
}

// Task adicional para tests unitarios (por si los necesitas en el futuro)
tasks.register('jacocoUnitTestReport', JacocoReport) {
    group = "Reporting"
    description = "Genera informes de cobertura JaCoCo para tests unitarios."

    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir("reports/jacoco/jacocoUnitTestReport/html")
    }

    def fileFilter = [
            '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
            '**/*Test*.*', '**/databinding/**/*.*', '**/*_Factory*.*', '**/*_HiltModules*.*',
            '**/*_MembersInjector*.*', '**/*_GeneratedInjector*.*', '**/*Dagger*.*', '**/*Hilt*.*',
            '**/*ComposableSingletons*.*', '**/*$lambda-*$*.*', '**/META-INF/*.*'
    ]

    def debugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def kotlinDebugTree = fileTree(dir: "${project.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def javaDebugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def altJavaDebugTree = fileTree(dir: "${project.buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)

    def classFiles = files([debugTree, kotlinDebugTree, javaDebugTree, altJavaDebugTree])
    classDirectories.setFrom(classFiles)

    sourceDirectories.setFrom(files([
            "${project.projectDir}/src/main/java",
            "${project.projectDir}/src/main/kotlin"
    ]))

    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/unit_test_code_coverage/**/*.exec"
    ]))
}
